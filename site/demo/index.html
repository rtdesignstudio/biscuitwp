<!-- HEADER ro=/demo/ en=/demo/en/ -->
<main id="main" class="wrap">
<h1>Demo: bannerul</h1>
<p>Așa vede bannerul un vizitator nou. Alege un stil, apoi încearcă butoanele. Pagina nu încarcă niciun tracker.</p>
<p class="switch" role="group" aria-label="Stilul bannerului">
<a href="/demo/?style=minimal" data-style="minimal">Minimal</a>
<a href="/demo/?style=brand" data-style="brand">Brand</a>
<a href="/demo/?style=friendly" data-style="friendly">Prietenos</a>
</p>
<p class="actions">
<button type="button" class="btn" id="demo-reset">Arată din nou</button>
<a class="btn btn-ghost" href="#cmp-settings" data-cmp-settings>Setări cookie</a>
</p>
<p class="muted small">Demo-ul pune un singur cookie, <code>cmp_consent</code>, strict necesar: ține minte alegerea ta o zi, doar pe <code>/demo/</code>. „Arată din nou” îl șterge.</p>
</main>
