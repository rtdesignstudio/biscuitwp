<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Demo · Consent Manager Pro</title>
<meta name="description" content="The Consent Manager Pro banner in three styles. No trackers.">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/demo/cmp.min.css">
<script src="/demo/demo.js"></script>
<script src="/demo/cmp.min.js" defer></script>
</head>
<body class="demo">
<!-- HEADER alt=/demo/ -->
<main id="main" class="wrap">
<h1>Demo: the banner</h1>
<p>This is what a new visitor sees. Pick a style, then try the buttons. The page loads no trackers.</p>
<p class="switch" role="group" aria-label="Banner style">
<a href="/demo/en/?style=minimal" data-style="minimal">Minimal</a>
<a href="/demo/en/?style=brand" data-style="brand">Brand</a>
<a href="/demo/en/?style=friendly" data-style="friendly">Friendly</a>
</p>
<p class="actions">
<button type="button" class="btn" id="demo-reset">Show again</button>
<a class="btn btn-ghost" href="#cmp-settings" data-cmp-settings>Cookie settings</a>
</p>
<p class="muted small">The demo sets a single, strictly necessary cookie, <code>cmp_consent</code>: it remembers your choice for one day, only on <code>/demo/</code>. "Show again" deletes it.</p>
</main>
<!-- FOOTER -->
</body>
</html>
